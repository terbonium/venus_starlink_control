# Starlink Control Configuration
#
# This file configures the Starlink D-Bus service.
# Edit these values and restart the service for changes to take effect.
#

# Starlink dish address (IP:port)
# Default is the standard Starlink dish address
DISH_ADDRESS="192.168.100.1:9200"

# Status update interval in milliseconds
# How often to poll the dish for status updates
# Lower values = more responsive but more network traffic
UPDATE_INTERVAL=5000

# Enable debug logging (0 or 1)
# Set to 1 for verbose logging to help troubleshoot issues
DEBUG=0

# Enable mock mode for testing without dish (0 or 1)
# When enabled, the service generates simulated data
# Useful for UI development/testing without a real dish
MOCK_MODE=0
